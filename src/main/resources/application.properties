# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── MySQL DataSource ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/queuesmart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
# validate = Hibernate checks schema matches entities; Flyway owns DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=QueueSmartSecretKey2024VeryLongAndSecureKeyForJWTSigning
jwt.expiration=86400000

# ── App ───────────────────────────────────────────────────────
spring.application.name=QueueSmart
